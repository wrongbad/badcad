[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "badcad"
version = "0.1.1"
description = "csg for python/jupyter environments"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "wrongbad" }]
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "manifold3d>=3.5,<4",
    "pythreejs",
    "nbformat",
]

[project.optional-dependencies]
text = ["pycairo"]
svg = ["svgelements"]
png = ["matplotlib"]
occt = ["cadquery-ocp-novtk>=8.0.1,<8.1", "scipy>=1.10,<2", "shapely>=2.0,<3"]
all = ["pycairo", "svgelements", "matplotlib", "cadquery-ocp-novtk>=8.0.1,<8.1", "scipy>=1.10,<2", "shapely>=2.0,<3"]

[project.urls]
Homepage = "https://github.com/wrongbad/badcad"

[tool.setuptools.packages.find]
include = ["badcad*"]
